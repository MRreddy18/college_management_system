<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">🎓 CollegeMS</div>

        <nav>

            <a href="{{ url_for('dashboard') }}">
                🏠 Dashboard
            </a>

            <a href="{{ url_for('students') }}" class="active">
                👨‍🎓 Students
            </a>

            <a href="{{ url_for('faculty') }}">
                👨‍🏫 Faculty
            </a>

            <a href="{{ url_for('attendance') }}">
                📋 Attendance
            </a>

            <a href="{{ url_for('fees') }}">
                💰 Fees
            </a>

            <a href="{{ url_for('announcements') }}">
                📢 Announcements
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <div class="form-container">

            <h2>Add New Student</h2>

            <form method="POST">

                <label>Student Name</label>

                <input type="text"
                       name="name"
                       placeholder="Enter student name"
                       required>


                <label>Email</label>

                <input type="email"
                       name="email"
                       placeholder="Enter email"
                       required>


                <label>Phone</label>

                <input type="text"
                       name="phone"
                       placeholder="Enter phone number"
                       required>


                <label>Course</label>

                <input type="text"
                       name="course"
                       placeholder="Example: BCA"
                       required>


                <label>Department</label>

                <input type="text"
                       name="department"
                       placeholder="Example: Computer Science"
                       required>


                <label>Year</label>

                <select name="year" required>

                    <option value="">Select Year</option>

                    <option>1st Year</option>

                    <option>2nd Year</option>

                    <option>3rd Year</option>

                </select>


                <div class="form-buttons">

                    <button class="btn" type="submit">
                        Add Student
                    </button>

                    <a href="{{ url_for('students') }}"
                       class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
